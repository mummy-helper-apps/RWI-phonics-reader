<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadows -->
    <filter id="bookShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>

    <!-- Cover Gradient -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Left Page Surface Gradient -->
    <linearGradient id="leftPageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="85%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Right Page Surface Gradient -->
    <linearGradient id="rightPageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="15%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Pale Blue Background Canvas -->
  <rect width="512" height="512" fill="#E2F0FD"/>

  <!-- Book Base -->
  <g filter="url(#bookShadow)">
    <!-- Book Cover Background Rim -->
    <path d="M 32 378 C 100 360, 190 360, 256 378 C 322 360, 412 360, 480 378 L 480 396 C 412 378, 322 378, 256 396 C 190 378, 100 378, 32 396 Z" fill="url(#coverGrad)"/>

    <!-- Page Stack Thickness Edge -->
    <path d="M 36 372 C 100 355, 190 355, 256 372 C 322 355, 412 355, 476 372 L 480 378 C 412 360, 322 360, 256 378 C 190 360, 100 360, 32 378 Z" fill="#94A3B8"/>

    <!-- Left Page -->
    <path d="M 256 128 C 188 110, 96 110, 36 128 L 36 372 C 96 354, 188 354, 256 372 Z" fill="url(#leftPageGrad)"/>

    <!-- Right Page -->
    <path d="M 256 128 C 324 110, 416 110, 476 128 L 476 372 C 416 354, 324 354, 256 372 Z" fill="url(#rightPageGrad)"/>

    <!-- Center Fold Spine Shadow -->
    <path d="M 244 126 C 252 129, 256 131, 256 131 C 256 131, 260 129, 268 126 L 268 370 C 260 368, 256 370, 256 370 C 256 370, 252 368, 244 370 Z" fill="#0F172A" opacity="0.15"/>
    <line x1="256" y1="128" x2="256" y2="372" stroke="#64748B" stroke-width="2" opacity="0.4"/>

    <!-- Red Ribbon Bookmark -->
    <path d="M 250 371 L 250 436 L 256 428 L 262 436 L 262 371 Z" fill="#EF4444"/>
  </g>

  <!-- Left Page: Lightning Bolt -->
  <g filter="url(#elementShadow)">
    <path d="M 160 162 
             L 114 250 
             H 152 
             L 128 338 
             L 198 230 
             H 158 
             Z" 
          fill="url(#lightningGrad)" 
          stroke="#1E293B" 
          stroke-width="2.5" 
          stroke-linejoin="round"/>
  </g>

  <!-- Right Page: Cursive Squiggly Script Lines -->
  <g stroke="#0F172A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85">
    <!-- Line 1 -->
    <path d="M 284 165 C 290 156, 294 156, 298 165 C 304 171, 310 171, 316 163 C 322 154, 328 154, 332 165 C 338 171, 344 167, 350 161 C 358 153, 364 157, 370 165 C 378 173, 386 161, 394 165 C 402 169, 408 161, 414 165 C 422 171, 430 157, 436 165 C 442 171, 448 163, 452 167"/>

    <!-- Line 2 -->
    <path d="M 284 192 C 292 182, 298 196, 306 188 C 312 182, 318 182, 324 192 C 330 198, 338 184, 344 190 C 350 196, 358 188, 366 192 C 374 196, 382 184, 390 190 C 396 194, 404 188, 412 192 C 420 196, 428 186, 434 190 C 440 194, 446 186, 450 192"/>

    <!-- Line 3 -->
    <path d="M 284 219 C 290 209, 296 223, 302 217 C 310 209, 316 223, 322 217 C 330 209, 336 213, 344 219 C 352 225, 358 213, 366 217 C 374 221, 380 213, 388 219 C 396 223, 402 213, 410 217 C 418 221, 426 213, 432 217 C 438 221, 444 213, 448 219"/>

    <!-- Line 4 -->
    <path d="M 284 246 C 292 238, 298 250, 304 244 C 312 236, 318 252, 326 244 C 332 238, 340 248, 348 242 C 356 236, 362 250, 370 244 C 378 238, 386 250, 394 244 C 400 238, 408 248, 416 242 C 424 236, 430 246, 436 242 C 442 238, 448 248, 452 244"/>

    <!-- Line 5 -->
    <path d="M 284 273 C 290 263, 296 277, 302 271 C 310 263, 316 279, 324 271 C 330 265, 338 275, 346 269 C 354 263, 360 277, 368 271 C 376 265, 384 277, 392 271 C 398 265, 406 275, 414 269 C 422 263, 428 273, 434 269 C 440 265, 446 273, 450 269"/>

    <!-- Line 6 -->
    <path d="M 284 300 C 292 292, 298 304, 306 298 C 312 292, 320 302, 328 296 C 336 290, 342 304, 350 298 C 358 292, 366 304, 374 298 C 380 292, 388 302, 396 296 C 404 290, 410 302, 418 296 C 426 290, 432 300, 438 296 C 444 292, 448 300, 452 296"/>

    <!-- Line 7 -->
    <path d="M 284 327 C 290 319, 296 331, 302 325 C 310 317, 316 331, 324 325 C 332 319, 338 331, 346 325 C 354 319, 360 329, 368 323 C 376 317, 384 329, 392 323 C 400 317, 406 327, 414 323 C 420 319, 426 327, 432 323 C 438 319, 444 327, 448 323"/>
  </g>
</svg>
